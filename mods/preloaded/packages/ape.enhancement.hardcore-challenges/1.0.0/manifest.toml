format_version = 5
id = "ape.enhancement.hardcore-challenges"
version = "1.0.0"
name = "Ape Escape Hardcore Challenges"
author = "nvd123"
description = "Experimental Monkey Mayhem and the combined full-game Nightmare Mode. Both features are disabled by default."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94423"
disc_sha256 = "1ae17e78ebb8c782c7c1785b0a0bd7b0ee28235b8a0c83c8df887129899a852a"

[[feature]]
id = "monkey-mayhem"
name = "Monkey Mayhem"
description = "Experimental monkey behavior challenge: sets a community-reported monkey-action cooldown at 0x800B4980 to zero each active-play frame, intended to make monkeys act and alert much more often. The RAM mapping is not verified in this build and may cause unusual AI or animation behavior."
group = "Hardcore Challenges"
default_enabled = false

[[plugin]]
feature = "monkey-mayhem"
id = "ape.challenge.monkey-mayhem"


[[feature]]
id = "nightmare-mode"
name = "Nightmare Mode"
description = "Full-game hardcore rules: health is capped at one hit, lives are capped at three for the entire run (including extra-life pickups), each stage has a strict three-minute time limit, and Monkey Mayhem keeps monkey action cooldown at zero. One toggle enables the complete ruleset."
group = "Hardcore Challenges"
default_enabled = false

[[plugin]]
feature = "nightmare-mode"
id = "ape.challenge.nightmare-mode"
