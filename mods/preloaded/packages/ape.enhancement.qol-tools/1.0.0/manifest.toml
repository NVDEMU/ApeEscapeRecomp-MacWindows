format_version = 5
id = "ape.enhancement.qol-tools"
version = "1.0.0"
name = "Ape Escape Quality-of-Life Tools"
author = "nvd123"
description = "Optional retry, camera pacing, collectible tracking, progress radar and speedrun HUD tools. Every feature is disabled by default."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94423"
disc_sha256 = "1ae17e78ebb8c782c7c1785b0a0bd7b0ee28235b8a0c83c8df887129899a852a"

[[feature]]
id = "quick-retry"
name = "Quick Retry"
description = "Select + L3 + R3 triggers a normal death/respawn and resets the displayed stage timer. Costs one life and requires at least two remaining; does not reset enemy or collectible state."
group = "Gameplay"
default_enabled = false

[[plugin]]
feature = "quick-retry"
id = "ape.qol.quick-retry"

[[feature]]
id = "camera-sensitivity"
name = "Camera Sensitivity"
description = "Rate-limit D-pad camera input in gameplay. Lower levels suppress more D-pad frames; menus and analog-stick axes are untouched."
group = "Controls"
default_enabled = false

[[option]]
feature = "camera-sensitivity"
id = "sensitivity"
label = "Camera sensitivity"
description = "Choose the proportion of camera D-pad frames to retain."
group = "Controls"
type = "choice"
default = "100"

[[option.choice]]
value = "25"
label = "25%"

[[option.choice]]
value = "50"
label = "50%"

[[option.choice]]
value = "75"
label = "75%"

[[option.choice]]
value = "100"
label = "100% (stock)"

[[plugin]]
feature = "camera-sensitivity"
id = "ape.qol.camera-sensitivity"

[[feature]]
id = "collectible-stats"
name = "Collectible Stats Overlay"
description = "Show captured-monkey, triangle and Specter-coin counters in a compact in-game HUD."
group = "HUD"
default_enabled = false

[[plugin]]
feature = "collectible-stats"
id = "ape.qol.collectible-stats"

[[feature]]
id = "enhanced-radar"
name = "Enhanced Radar"
description = "Show a 20-entry caught/uncaught monkey progress panel. This is a progress tracker, not a spatial map of live monkey positions."
group = "HUD"
default_enabled = false

[[plugin]]
feature = "enhanced-radar"
id = "ape.qol.enhanced-radar"

[[feature]]
id = "speedrun-timer"
name = "Speedrun Timer"
description = "Display the game's own level timer as MM:SS.t during active gameplay."
group = "HUD"
default_enabled = false

[[plugin]]
feature = "speedrun-timer"
id = "ape.qol.speedrun-timer"
