name: macOS app and release

on:
  push:
    branches: ['**']
    tags: ['macos-v*']
  workflow_dispatch:

permissions:
  contents: write


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check macOS packaging shell syntax
        run: bash -n tools/package_macos.sh
      - name: Check calibrated controller defaults
        run: python3 tools/check_controller_defaults.py
      - name: Check draw-distance audit tool syntax
        run: python3 -m py_compile tools/audit_draw_distance.py
      - name: Check macOS install guide exists
        run: test -s packaging/macos/START_HERE.txt

  check-assets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        shell: bash
        env:
          DISC_URL: ${{ secrets.APE_ESCAPE_DISC_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DISC_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$DROPBOX_APP_KEY" ] && [ -n "$DROPBOX_APP_SECRET" ] && [ -n "$DROPBOX_REFRESH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS build skipped. Configure either APE_ESCAPE_DISC_URL, or all three private Dropbox OAuth secrets: DROPBOX_APP_KEY, DROPBOX_APP_SECRET, DROPBOX_REFRESH_TOKEN."
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::A manual or tagged release requires a CHD download URL or all three Dropbox OAuth secrets."
              exit 1
            fi
          fi

  build-macos:
    needs: [lint, check-assets]
    if: needs.check-assets.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_JOBS: 2
      AOT_WORKERS: 2
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macOS build tools
        run: |
          brew install cmake ninja sdl3 ccache dylibbundler rom-tools
          command -v chdman

      - name: Record pinned framework revision
        id: pins
        run: echo "framework=$(git -C psxrecomp-v4 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'game.toml', 'src/**', 'mods/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.arch }}-

      - name: Cache pinned overlay tool downloads
        uses: actions/cache@v4
        with:
          path: tools/_toolchain_cache
          key: overlay-downloads-${{ matrix.arch }}-${{ steps.pins.outputs.framework }}
          restore-keys: |
            overlay-downloads-${{ matrix.arch }}-

      - name: Download original disc from Dropbox
        id: disc
        env:
          DISC_URL: ${{ secrets.APE_ESCAPE_DISC_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ape-disc" apeescape
          DEST="$RUNNER_TEMP/Ape Escape (USA).chd"
          if [ -n "$DISC_URL" ]; then
            # Convenience mode: the secret contains a Dropbox shared link with
            # dl=1. The link itself is never printed or checked into the repo.
            curl --fail --location --retry 3 --retry-delay 2 "$DISC_URL" -o "$DEST"
          else
            # Private mode: exchange a refresh token for a short-lived access
            # token, then download by Dropbox path without any public link.
            TOKEN_JSON="$(curl --fail --silent --show-error --user "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=$DROPBOX_REFRESH_TOKEN" \
              https://api.dropbox.com/oauth2/token)"
            ACCESS_TOKEN="$(printf '%s' "$TOKEN_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
            echo "::add-mask::$ACCESS_TOKEN"
            curl --fail --silent --show-error --location --retry 3 \
              -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H 'Dropbox-API-Arg: {"path":"/ApeEscapeWii-private-assets/Ape Escape (USA).chd"}' \
              https://content.dropboxapi.com/2/files/download \
              -o "$DEST"
          fi
          test -s "$DEST"
          echo "Downloaded CHD into runner temp storage; it will not be committed or attached to the release."

      - name: Build the recompiler and bundled OpenBIOS
        run: |
          set -euo pipefail
          cmake -S psxrecomp-v4/recompiler -B psxrecomp-v4/recompiler/build -G Ninja \
             -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build psxrecomp-v4/recompiler/build --parallel "$BUILD_JOBS" --target psxrecomp-game psxrecomp-bios
          (
            cd psxrecomp-v4
            bash tools/regen_bios.sh --config bios/OpenBIOS.toml
          )

      - name: Convert CHD to CUE/BIN and prepare disc with the assets workflow's method
        run: |
          set -euo pipefail
          # The pinned prepare_disc helper is not built with a CHD reader.
          # Use the same chdman extract flow as ApeEscapeWii-privateassets.
          chdman verify -i "$RUNNER_TEMP/Ape Escape (USA).chd"
          chdman extractcd \
            -i "$RUNNER_TEMP/Ape Escape (USA).chd" \
            -o "$RUNNER_TEMP/Ape Escape (USA).cue" \
            -ob "$RUNNER_TEMP/Ape Escape (USA).bin"
          test -s "$RUNNER_TEMP/Ape Escape (USA).cue"
          test -s "$RUNNER_TEMP/Ape Escape (USA).bin"
          python3 psxrecomp-v4/tools/prepare_disc.py "$RUNNER_TEMP/Ape Escape (USA).cue" --config game.toml
          test -s "apeescape/Ape Escape (USA).cue"
          test -s "apeescape/Ape Escape (USA).bin"
          test -s "apeescape/SCUS_944.23"

      - name: Audit known culling sites for draw-distance research
        continue-on-error: true
        run: python3 tools/audit_draw_distance.py apeescape/SCUS_944.23

      - name: Extract disc executable and generate game translation on cache miss
        run: |
          set -euo pipefail
          if [ ! -f generated/SCUS_944.23_dispatch.c ]; then
            psxrecomp-v4/recompiler/build/psxrecomp-game --config game.toml
          else
            echo "Restored generated game translation from the Actions cache."
          fi
          test -s generated/SCUS_944.23_dispatch.c

      - name: Configure optimized macOS runtime
        run: |
          cmake -S . -B build-macos-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DPSX_DEBUG_TOOLS=OFF \
            -DPSX_SDL_BACKEND=SDL3 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile the runtime and tests
        run: |
          cmake --build build-macos-release --parallel "$BUILD_JOBS" --target psx-runtime ape_stick_response_test ape_preloaded_mods_test
          ctest --test-dir build-macos-release --output-on-failure -R 'ape_stick_response_test|ape_preloaded_mods_test'

      - name: Package .app, DMG and ZIP
        run: bash tools/package_macos.sh
        env:
          BUILD_DIR: ${{ github.workspace }}/build-macos-release
          OUT_DIR: ${{ github.workspace }}/release-macos
          AOT_WORKERS: 2

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: ape-escape-macos-${{ matrix.arch }}
          path: |
            release-macos/*.zip
            release-macos/*.dmg
            release-macos/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    needs: [lint, check-assets, build-macos]
    if: needs.check-assets.outputs.ready == 'true' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
    concurrency:
      group: ape-escape-macos-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Download both architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: ape-escape-macos-*
          path: dist
          merge-multiple: true

      - name: Publish or update the macOS release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'macos-nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Ape Escape Recompiled — macOS Nightly' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            macOS builds of Ape Escape Recompiled.

            Includes Apple Silicon (arm64) and Intel (x86_64) packages. Download the ZIP or DMG for your Mac. This preview is ad-hoc signed, not Developer ID signed or notarized, so macOS may show a Gatekeeper warning on first launch.

            The game disc and retail PlayStation BIOS are not included. The packaged OpenBIOS is MIT-licensed.
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS-macos-*.txt
