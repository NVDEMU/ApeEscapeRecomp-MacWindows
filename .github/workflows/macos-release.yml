name: Windows + macOS apps and Nightly release

on:
  push:
    branches: ['**']
    tags: ['macos-v*']
  workflow_dispatch:

permissions:
  contents: write


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and pinned launcher
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check launcher updater patch anchors
        run: |
          python3 tools/apply_recomp_ui_update_patch.py --ui-root recomp-ui
          python3 tools/apply_recomp_ui_update_patch.py --ui-root recomp-ui --check
      - name: Check updater helper syntax and archive safety
        run: |
          python3 -m py_compile tools/in_app_updater.py tools/apply_recomp_ui_update_patch.py tools/write_build_provenance.py
          python3 tools/test_nightly_updater.py
      - name: Check disc downloader and CHD validation
        run: |
          set -euo pipefail
          python3 -m py_compile tools/download_disc.py tools/test_download_disc.py
          python3 tools/test_download_disc.py
      - name: Check audiovisual guardrails
        run: python3 tools/test_audiovisual_guardrails.py
      - name: Check Monkepedia catalogue and manual caught checklist
        run: python3 tools/test_monke_catalog.py
      - name: Check macOS packaging shell syntax
        run: bash -n tools/package_macos.sh
      - name: Check Linux packaging shell syntax
        run: |
          set -euo pipefail
          bash -n tools/package_appimage.sh
          bash -n tools/test_appimage_layout.sh
      - name: Check calibrated controller defaults
        run: python3 tools/check_controller_defaults.py
      - name: Check Challenge Pack source and manifest
        run: |
          set -euo pipefail
          cc -std=c99 -Wall -Wextra -Werror -fsyntax-only -Ipsxrecomp-v4/runtime/include src/mods/ape_challenge_pack_plugin.c
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          path = Path("mods/preloaded/packages/ape.enhancement.challenge-pack/1.0.0/manifest.toml")
          manifest = tomllib.loads(path.read_text(encoding="utf-8"))
          expected = {"time-trial", "no-damage", "limited-lives", "random-challenge"}
          features = manifest.get("feature", [])
          ids = {feature.get("id") for feature in features}
          if ids != expected:
              raise SystemExit(f"Unexpected Challenge Pack features: {ids}")
          if any(feature.get("default_enabled") is not False for feature in features):
              raise SystemExit("Every Challenge Pack feature must default to off")
          plugins = {plugin.get("id") for plugin in manifest.get("plugin", [])}
          expected_plugins = {
              "ape.challenge.time-trial",
              "ape.challenge.no-damage",
              "ape.challenge.limited-lives",
              "ape.challenge.random-challenge",
          }
          if plugins != expected_plugins:
              raise SystemExit(f"Unexpected Challenge Pack plugin mapping: {plugins}")

          hardcore_path = Path("mods/preloaded/packages/ape.enhancement.hardcore-challenges/1.0.0/manifest.toml")
          hardcore = tomllib.loads(hardcore_path.read_text(encoding="utf-8"))
          expected_hardcore = {"monkey-mayhem", "nightmare-mode"}
          hardcore_features = hardcore.get("feature", [])
          hardcore_ids = {feature.get("id") for feature in hardcore_features}
          if hardcore_ids != expected_hardcore:
              raise SystemExit(f"Unexpected Hardcore Challenges features: {hardcore_ids}")
          if any(feature.get("default_enabled") is not False for feature in hardcore_features):
              raise SystemExit("Every Hardcore Challenges feature must default to off")
          expected_hardcore_plugins = {
              "ape.challenge.monkey-mayhem",
              "ape.challenge.nightmare-mode",
          }
          hardcore_plugins = {plugin.get("id") for plugin in hardcore.get("plugin", [])}
          if hardcore_plugins != expected_hardcore_plugins:
              raise SystemExit(f"Unexpected Hardcore Challenges plugin mapping: {hardcore_plugins}")

          source = Path("src/mods/ape_challenge_pack_plugin.c").read_text(encoding="utf-8")
          for plugin in expected_plugins | expected_hardcore_plugins:
              if plugin not in source:
                  raise SystemExit(f"Missing native callback registration: {plugin}")
          if "0x800B4980u" not in source or source.count("enforce_monkey_action_cooldown();") < 2:
              raise SystemExit("Monkey Mayhem must enforce the cooldown independently and from Nightmare Mode")
          print("Challenge Pack: C syntax, four default-off features, and two default-off Hardcore Challenges features verified.")
          PY
      - name: Check Extended Draw Distance catalog and guarded sites
        run: python3 tools/check_draw_distance_defaults.py
      - name: Check draw-distance audit tool syntax
        run: python3 -m py_compile tools/audit_draw_distance.py
      - name: Check macOS install guide exists
        run: test -s packaging/macos/START_HERE.txt

  check-assets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        shell: bash
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          set -euo pipefail
          if [ -z "$GAME_ASSETS_TOKEN" ]; then
            echo "::error::GAME_ASSETS_TOKEN is missing. Add a fine-grained token with Contents: Read-only access to NVDEMU/apeescapeprivateassets."
            exit 1
          fi
          repo_json="$RUNNER_TEMP/private-assets-repo.json"
          repo_status="$(curl --silent --show-error --output "$repo_json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GAME_ASSETS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GAME_ASSETS_REPO")"
          if [ "$repo_status" != "200" ]; then
            echo "::error::Private assets repository returned HTTP $repo_status. Confirm GAME_ASSETS_REPO is exact and GAME_ASSETS_TOKEN is authorized for that repository with Contents: Read-only."
            exit 1
          fi
          release_json="$RUNNER_TEMP/private-assets-release.json"
          release_status="$(curl --silent --show-error --output "$release_json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GAME_ASSETS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GAME_ASSETS_REPO/releases/tags/$GAME_ASSETS_TAG")"
          if [ "$release_status" != "200" ]; then
            echo "::error::Private repository access worked, but release tag '$GAME_ASSETS_TAG' returned HTTP $release_status. Confirm the release is published and the tag matches exactly."
            exit 1
          fi
          python3 - "$release_json" "$GAME_ASSETS_FILENAME" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          name = sys.argv[2]
          assets = payload.get("assets", [])
          matches = [asset for asset in assets if asset.get("name") == name]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one private release asset named {name!r}, found {len(matches)}.")
          size = matches[0].get("size", 0)
          if not isinstance(size, int) or size < 10 * 1024 * 1024:
              raise SystemExit(f"Private release asset {name!r} has unexpected size {size!r}.")
          print(f"Private asset access confirmed: {name} ({size:,} bytes).")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: [lint, check-assets]
    if: needs.check-assets.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_JOBS: 2
      AOT_WORKERS: 2
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macOS build tools
        run: |
          brew install cmake ninja sdl3 ccache dylibbundler rom-tools
          command -v chdman

      - name: Record pinned framework revision
        id: pins
        run: echo "framework=$(git -C psxrecomp-v4 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'game.toml', 'src/**', 'mods/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.arch }}-

      - name: Cache pinned overlay tool downloads
        uses: actions/cache@v4
        with:
          path: tools/_toolchain_cache
          key: overlay-downloads-${{ matrix.arch }}-${{ steps.pins.outputs.framework }}
          restore-keys: |
            overlay-downloads-${{ matrix.arch }}-

      - name: Download and validate original disc
        id: disc
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ape-disc" apeescape
          DEST="$RUNNER_TEMP/Ape Escape (USA).chd"
          python3 tools/download_disc.py "$DEST"
          echo "Validated CHD stored in runner temp storage; it will not be committed or attached to the release."

      - name: Build the recompiler and bundled OpenBIOS
        run: |
          set -euo pipefail
          cmake -S psxrecomp-v4/recompiler -B psxrecomp-v4/recompiler/build -G Ninja \
             -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build psxrecomp-v4/recompiler/build --parallel "$BUILD_JOBS" --target psxrecomp-game psxrecomp-bios
          (
            cd psxrecomp-v4
            bash tools/regen_bios.sh --config bios/OpenBIOS.toml
          )

      - name: Convert CHD to CUE/BIN and prepare disc with the assets workflow's method
        run: |
          set -euo pipefail
          # The pinned prepare_disc helper is not built with a CHD reader.
          # Validate and extract the CHD fetched from the private assets release.
          chdman verify -i "$RUNNER_TEMP/Ape Escape (USA).chd"
          chdman extractcd \
            -i "$RUNNER_TEMP/Ape Escape (USA).chd" \
            -o "$RUNNER_TEMP/Ape Escape (USA).cue" \
            -ob "$RUNNER_TEMP/Ape Escape (USA).bin"
          test -s "$RUNNER_TEMP/Ape Escape (USA).cue"
          test -s "$RUNNER_TEMP/Ape Escape (USA).bin"
          python3 psxrecomp-v4/tools/prepare_disc.py "$RUNNER_TEMP/Ape Escape (USA).cue" --config game.toml
          test -s "apeescape/Ape Escape (USA).cue"
          test -s "apeescape/Ape Escape (USA).bin"
          test -s "apeescape/SCUS_944.23"

      - name: Audit known culling sites for draw-distance research
        continue-on-error: true
        run: python3 tools/audit_draw_distance.py apeescape/SCUS_944.23 --candidate-context 40

      - name: Extract disc executable and generate game translation on cache miss
        run: |
          set -euo pipefail
          if [ ! -f generated/SCUS_944.23_dispatch.c ]; then
            psxrecomp-v4/recompiler/build/psxrecomp-game --config game.toml
          else
            echo "Restored generated game translation from the Actions cache."
          fi
          test -s generated/SCUS_944.23_dispatch.c

      - name: Configure optimized macOS runtime
        run: |
          cmake -S . -B build-macos-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DPSX_DEBUG_TOOLS=OFF \
            -DPSX_SDL_BACKEND=SDL3 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile the runtime and tests
        run: |
          cmake --build build-macos-release --parallel "$BUILD_JOBS" --target psx-runtime ape_stick_response_test ape_preloaded_mods_test
          ctest --test-dir build-macos-release --output-on-failure -R 'ape_stick_response_test|ape_preloaded_mods_test'

      - name: Write release provenance for the updater
        run: python3 tools/write_build_provenance.py

      - name: Package .app, DMG and ZIP
        run: bash tools/package_macos.sh
        env:
          BUILD_DIR: ${{ github.workspace }}/build-macos-release
          OUT_DIR: ${{ github.workspace }}/release-macos
          AOT_WORKERS: 2

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: ape-escape-macos-${{ matrix.arch }}
          path: |
            release-macos/*.zip
            release-macos/*.dmg
            release-macos/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14


  build-windows:
    needs: [lint, check-assets]
    if: needs.check-assets.outputs.ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python for release metadata
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the MinGW-w64 build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ccache

      - name: Install CHD extraction tools
        shell: powershell
        run: |
          choco install mame --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "MAME/CHD tools installation failed (exit $LASTEXITCODE)." }
          $tool = Get-Command chdman.exe -ErrorAction SilentlyContinue
          if (-not $tool) {
            $root = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
            $found = Get-ChildItem -Path (Join-Path $root 'lib') -Filter chdman.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $dir = $found.DirectoryName
              Add-Content -Path $env:GITHUB_PATH -Value $dir
              Write-Host "Using chdman from $dir"
            } else {
              throw 'chdman.exe was not found after installing MAME.'
            }
          } else {
            $dir = Split-Path -Parent $tool.Source
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            Write-Host "Using chdman from $dir"
          }

      - name: Download and validate original disc
        shell: powershell
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'Ape Escape (USA).chd'
          & python.exe tools/download_disc.py $dest
          if ($LASTEXITCODE -ne 0) { throw "Validated CHD download failed (exit $LASTEXITCODE)." }
          Write-Host 'Validated CHD stored in runner temp storage; it will not be checked into the repository or release.'

      - name: Verify and prepare the original disc
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $chd = Join-Path $env:RUNNER_TEMP 'Ape Escape (USA).chd'
          $cue = Join-Path $env:RUNNER_TEMP 'Ape Escape (USA).cue'
          $bin = Join-Path $env:RUNNER_TEMP 'Ape Escape (USA).bin'
          & chdman.exe verify -i $chd
          if ($LASTEXITCODE -ne 0) { throw "chdman verify failed (exit $LASTEXITCODE)." }
          & chdman.exe extractcd -i $chd -o $cue -ob $bin
          if ($LASTEXITCODE -ne 0) { throw "chdman extractcd failed (exit $LASTEXITCODE)." }
          if (!(Test-Path -LiteralPath $cue) -or !(Test-Path -LiteralPath $bin)) {
            throw 'CHD extraction did not create both CUE and BIN files.'
          }
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          Write-Host "Using Python for disc prep: $python"
          & $python 'psxrecomp-v4/tools/prepare_disc.py' $cue --config game.toml
          if ($LASTEXITCODE -ne 0) { throw "prepare_disc.py failed (exit $LASTEXITCODE)." }
          if (!(Test-Path -LiteralPath 'apeescape/SCUS_944.23')) { throw 'Prepared Ape Escape executable is missing.' }

      - name: Test updater and launcher integration
        shell: powershell
        run: |
          python tools/apply_recomp_ui_update_patch.py --ui-root recomp-ui
          python tools/apply_recomp_ui_update_patch.py --ui-root recomp-ui --check
          python -m py_compile tools/in_app_updater.py tools/apply_recomp_ui_update_patch.py tools/write_build_provenance.py
          python tools/test_nightly_updater.py

      - name: Package the Windows x64 release
        shell: powershell
        run: |
          python tools/write_build_provenance.py
          .\tools\package_release.ps1 -Jobs 2
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed (exit $LASTEXITCODE)." }

      - name: Build and run native tests
        shell: powershell
        run: |
          $gcc = Get-Command gcc.exe -ErrorAction Stop
          $mingwBin = Split-Path -Parent $gcc.Source
          $env:PATH = "$mingwBin;$env:PATH"
          $cmake = Join-Path $mingwBin 'cmake.exe'
          $ctest = Join-Path $mingwBin 'ctest.exe'
          if (!(Test-Path -LiteralPath $cmake)) { $cmake = (Get-Command cmake.exe -ErrorAction Stop).Source }
          if (!(Test-Path -LiteralPath $ctest)) { $ctest = (Get-Command ctest.exe -ErrorAction Stop).Source }
          Write-Host "Using MinGW tools from $mingwBin"
          & $cmake --build build-release --target ape_stick_response_test ape_preloaded_mods_test --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Building tests failed (exit $LASTEXITCODE)." }
          & $ctest --test-dir build-release --output-on-failure -R 'ape_stick_response_test|ape_preloaded_mods_test'
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed (exit $LASTEXITCODE)." }

      - name: Upload the Windows x64 release file
        uses: actions/upload-artifact@v4
        with:
          name: ape-escape-windows-x64
          path: |
            ApeEscapeRecomp-*-windows-x64.zip
            SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-linux:
    needs: [lint, check-assets]
    if: needs.check-assets.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_JOBS: 2
      AOT_WORKERS: 2
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build and AppImage dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev imagemagick curl file patchelf desktop-file-utils fuse3 libfuse2 mame-tools
          command -v chdman
      - name: Build SDL3 from source for Ubuntu 24.04
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.2.8 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/SDL/build" --parallel "$BUILD_JOBS"
          sudo cmake --install "$RUNNER_TEMP/SDL/build"
          sudo ldconfig
          pkg-config --modversion sdl3
      - name: Record pinned framework revision
        id: pins
        run: echo "framework=$(git -C psxrecomp-v4 rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-x86_64-${{ hashFiles('CMakeLists.txt', 'game.toml', 'src/**', 'mods/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-x86_64-
      - name: Cache pinned overlay tool downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/recomp-appimage-tools
          key: overlay-downloads-linux-x86_64-${{ steps.pins.outputs.framework }}
          restore-keys: overlay-downloads-linux-x86_64-
      - name: Download and validate original disc
        id: disc
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ape-disc" apeescape
          DEST="$RUNNER_TEMP/Ape Escape (USA).chd"
          python3 tools/download_disc.py "$DEST"
          echo "Validated CHD stored in runner temp storage; it will not be committed or attached to the release."

      - name: Build recompiler and OpenBIOS
        run: |
          set -euo pipefail
          cmake -S psxrecomp-v4/recompiler -B psxrecomp-v4/recompiler/build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build psxrecomp-v4/recompiler/build-linux --parallel "$BUILD_JOBS" --target psxrecomp-game psxrecomp-bios
          (cd psxrecomp-v4 && PSXRECOMP_BIOS_BUILD=recompiler/build-linux bash tools/regen_bios.sh --config bios/OpenBIOS.toml)
      - name: Convert CHD and prepare game executable
        run: |
          set -euo pipefail
          chdman verify -i "$RUNNER_TEMP/Ape Escape (USA).chd"
          chdman extractcd -i "$RUNNER_TEMP/Ape Escape (USA).chd" -o "$RUNNER_TEMP/Ape Escape (USA).cue" -ob "$RUNNER_TEMP/Ape Escape (USA).bin"
          python3 psxrecomp-v4/tools/prepare_disc.py "$RUNNER_TEMP/Ape Escape (USA).cue" --config game.toml
          test -s apeescape/SCUS_944.23
      - name: Generate native game translation
        run: |
          set -euo pipefail
          if [ ! -f generated/SCUS_944.23_dispatch.c ]; then psxrecomp-v4/recompiler/build-linux/psxrecomp-game --config game.toml; fi
          test -s generated/SCUS_944.23_dispatch.c
      - name: Test launcher patch and updater helpers
        run: |
          set -euo pipefail
          python3 tools/apply_recomp_ui_update_patch.py --ui-root recomp-ui
          python3 tools/apply_recomp_ui_update_patch.py --ui-root recomp-ui --check
          python3 -m py_compile tools/in_app_updater.py tools/apply_recomp_ui_update_patch.py tools/write_build_provenance.py
          python3 tools/test_nightly_updater.py
      - name: Build and test Linux AppImage
        run: |
          set -euo pipefail
          python3 tools/write_build_provenance.py
          bash tools/package_appimage.sh --jobs 2 --nice 0
          APPIMAGE="$(find release-linux -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          bash tools/test_appimage_layout.sh "$APPIMAGE"
          cmake --build build-appimage --target ape_stick_response_test ape_preloaded_mods_test --parallel 2
          ctest --test-dir build-appimage --output-on-failure -R 'ape_stick_response_test|ape_preloaded_mods_test'
          sha256sum "$APPIMAGE" | sed "s|  $APPIMAGE|  $(basename "$APPIMAGE")|" > release-linux/SHA256SUMS-linux-x86_64.txt
      - name: Upload Linux x86_64 release
        uses: actions/upload-artifact@v4
        with:
          name: ape-escape-linux-x86_64
          path: |
            release-linux/*.AppImage
            release-linux/SHA256SUMS-linux-x86_64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  normalize-nightly-release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Promote the existing Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/releases/tags/macos-nightly")"
          release_id="$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          curl --fail --silent --show-error --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"name":"Nightly","prerelease":false,"make_latest":"true"}' \
            "https://api.github.com/repos/${GH_REPOSITORY}/releases/${release_id}" \
            > /dev/null
          echo "Renamed macos-nightly to Nightly and marked it as the latest release."

  publish-release:
    needs: [lint, check-assets, build-macos, build-windows, build-linux]
    if: needs.check-assets.outputs.ready == 'true' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
    concurrency:
      group: ape-escape-macos-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: ape-escape-*
          path: dist
          merge-multiple: true

      - name: Create Nightly updater manifest
        shell: bash
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          version = Path("packaging/release/VERSION").read_text(encoding="utf-8").strip()
          nightly = os.environ["BUILD_REF"] == "refs/heads/master"
          manifest = {
              "schema_version": 1,
              "repository": "NVDEMU/ApeEscapeRecomp-MacWindowsLinux",
              "channel": "nightly" if nightly else "stable",
              "tag": "macos-nightly" if nightly else os.environ["BUILD_REF"].removeprefix("refs/tags/"),
              "version": version,
              "commit": os.environ["BUILD_COMMIT"],
              "run_id": os.environ["BUILD_RUN_ID"],
              "run_number": os.environ["BUILD_RUN_NUMBER"],
              "built_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          Path("dist/nightly-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print("Wrote dist/nightly-manifest.json for", manifest["channel"], manifest["commit"][:12])

      - name: Publish or update the macOS release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'macos-nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Nightly' }}
          prerelease: false
          make_latest: ${{ github.ref_type != 'tag' }}
          fail_on_unmatched_files: true
          body: |
            Windows, macOS, and Linux builds of Ape Escape Recompiled - Enhanced Edition, maintained by nvd123.

            Downloads include Windows x64, macOS Apple Silicon (arm64), macOS Intel (x86_64) ZIP packages and Linux x86_64 AppImage. The Mac release also includes DMGs. Mac builds are ad-hoc signed, not Developer ID signed or notarized, so Gatekeeper may show a first-launch warning.

            The in-app updater checks this repository's Nightly release, selects the supported Windows/macOS platform package, and verifies its SHA-256 checksum before installation. Linux AppImage updates are currently installed manually from Releases. The release includes nightly-manifest.json for update detection.

            The game disc and retail PlayStation BIOS are not included. The packaged OpenBIOS is MIT-licensed.
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/SHA256SUMS-macos-*.txt
            dist/SHA256SUMS-windows-x64.txt
            dist/SHA256SUMS-linux-x86_64.txt
            dist/nightly-manifest.json
