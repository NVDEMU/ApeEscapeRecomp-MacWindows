name: Experimental WebAssembly feasibility

on:
  workflow_dispatch:
  push:
    branches: [experimental-webassembly]
    paths:
      - '.github/workflows/webassembly.yml'
      - 'docs/WEBASSEMBLY.md'
      - 'CMakeLists.txt'
      - 'game.toml'
      - 'aot/overlays-web.json'
      - 'tools/**'
      - 'web/**'
      - 'psxrecomp-v4'
      - 'recomp-ui'
      - 'generated/**'
      - 'src/**'
      - 'mods/preloaded/**'

permissions:
  contents: read

concurrency:
  group: webassembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emscripten-feasibility:
    name: Emscripten configure and compile probe
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check browser-port patches and launcher shell
        run: python tools/test_webassembly_support.py

      - name: Install disc tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mame-tools ninja-build
          command -v chdman

      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten toolchain
        run: |
          set -euo pipefail
          emcc --version
          command -v emcmake
          cat > "$RUNNER_TEMP/emscripten-smoke.c" <<'EOF'
          #include <stdio.h>
          int main(void) { puts("Emscripten toolchain OK"); return 0; }
          EOF
          emcc "$RUNNER_TEMP/emscripten-smoke.c" -O2 -o "$RUNNER_TEMP/emscripten-smoke.html"
          test -s "$RUNNER_TEMP/emscripten-smoke.wasm"
          test -s "$RUNNER_TEMP/emscripten-smoke.js"

      - name: Build native recompiler and OpenBIOS generator
        run: |
          set -euo pipefail
          cmake -S psxrecomp-v4/recompiler -B psxrecomp-v4/recompiler/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build psxrecomp-v4/recompiler/build --parallel 2 --target psxrecomp-game psxrecomp-bios
          (cd psxrecomp-v4 && bash tools/regen_bios.sh --config bios/OpenBIOS.toml)

      - name: Download private build-time game image
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          set -euo pipefail
          python3 tools/download_disc.py "$RUNNER_TEMP/Ape Escape (USA).chd"
          test -s "$RUNNER_TEMP/Ape Escape (USA).chd"

      - name: Prepare disc inputs and generate translation
        run: |
          set -euo pipefail
          chdman verify -i "$RUNNER_TEMP/Ape Escape (USA).chd"
          chdman extractcd -i "$RUNNER_TEMP/Ape Escape (USA).chd" -o "$RUNNER_TEMP/Ape Escape (USA).cue" -ob "$RUNNER_TEMP/Ape Escape (USA).bin"
          python3 psxrecomp-v4/tools/prepare_disc.py "$RUNNER_TEMP/Ape Escape (USA).cue" --config game.toml
          test -s apeescape/SCUS_944.23
          if [ ! -s generated/SCUS_944.23_dispatch.c ]; then
            psxrecomp-v4/recompiler/build/psxrecomp-game --config game.toml
          fi
          test -s generated/SCUS_944.23_dispatch.c

      - name: Compile audited disc overlays into static browser C sources
        run: |
          set -euo pipefail
          python3 psxrecomp-v4/tools/aot_overlay_pipeline.py static \
            --profile aot/overlays-web.json \
            --game-toml game.toml \
            --disc "$RUNNER_TEMP/Ape Escape (USA).cue" \
            --recompiler psxrecomp-v4/recompiler/build/psxrecomp-game \
            --work-dir "$RUNNER_TEMP/aot-overlays-web" \
            --out-dir generated \
            --workers 2
          test -s generated/overlays_static.c
          find generated -maxdepth 1 -type f -name 'overlays_static_[0-9][0-9][0-9][0-9].c' -print | grep -q .

      - name: Attempt Emscripten CMake build and capture blockers
        shell: bash
        run: |
          set +e
          BUILD_DIR="$RUNNER_TEMP/wasm-probe/build"
          mkdir -p "$BUILD_DIR"
          {
            # Generated AOT C files are very large; -O3 made the final overlay
            # translation unit take an excessive amount of time in CI. Use -O1
            # for this experimental feasibility build, keeping Release semantics
            # while making browser compilation more tractable.
            echo '$ emcmake cmake -S . -B BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release (C/CXX Release flags: -O1 -DNDEBUG)'
            emcmake cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_C_FLAGS_RELEASE=-O1 -DNDEBUG" \
              "-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG" \
              -DCMAKE_EXECUTABLE_SUFFIX=.js -DPSX_RECOMP_UI=OFF -DPSX_DEBUG_TOOLS=OFF -DPSX_ENABLE_VULKAN=OFF -DPSX_NETPLAY=OFF -DBUILD_TESTING=OFF
            configure_status=$?
            echo "CMAKE_CONFIGURE_EXIT=$configure_status"
            if [ "$configure_status" -eq 0 ]; then
              echo '$ cmake --build BUILD_DIR --parallel 2'
              cmake --build "$BUILD_DIR" --parallel 2
              build_status=$?
              echo "CMAKE_BUILD_EXIT=$build_status"
            else
              echo "CMAKE_BUILD_SKIPPED=configure failed"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/wasm-probe/emscripten-build.log"
          cp "$RUNNER_TEMP/wasm-probe/emscripten-build.log" webassembly-build.log
          if [ -s "$BUILD_DIR/ApeEscapeRecomp.js" ] && [ -s "$BUILD_DIR/ApeEscapeRecomp.wasm" ] && [ -s "$BUILD_DIR/ApeEscapeRecomp.data" ]; then
            mkdir -p web-dist
            cp web/index.html "$BUILD_DIR/index.html"
            cp "$BUILD_DIR/ApeEscapeRecomp.js" "$BUILD_DIR/ApeEscapeRecomp.wasm" "$BUILD_DIR/ApeEscapeRecomp.data" "$BUILD_DIR/index.html" web-dist/
            echo "BROWSER_BUNDLE_READY=1"
          else
            echo "BROWSER_BUNDLE_READY=0 (no complete JS/WASM/data bundle was produced)"
          fi
          echo "Captured configure/build result; failures are logged so diagnostics can still be uploaded."

      - name: Upload experimental browser bundle
        if: always() && hashFiles('web-dist/index.html', 'web-dist/ApeEscapeRecomp.js', 'web-dist/ApeEscapeRecomp.wasm', 'web-dist/ApeEscapeRecomp.data') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ApeEscapeRecomp-WebAssembly-Experimental
          path: web-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Emscripten feasibility log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ApeEscapeRecomp-WebAssembly-feasibility-log
          path: webassembly-build.log
          if-no-files-found: warn
          retention-days: 14
