name: Experimental Android APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'CMakeLists.txt'
      - 'game.toml'
      - 'mods/preloaded/**'
      - 'tools/apply_android_runtime_patch.py'
      - 'tools/test_android_support.py'
      - 'psxrecomp-v4'
      - 'recomp-ui'
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'CMakeLists.txt'
      - 'game.toml'
      - 'mods/preloaded/**'
      - 'tools/apply_android_runtime_patch.py'
      - 'tools/test_android_support.py'
      - 'psxrecomp-v4'
      - 'recomp-ui'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-arm64:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Android source patches and app scaffolding
        run: python tools/test_android_support.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build recompiler and OpenBIOS runtime sources
        run: |
          set -euo pipefail
          cmake -S psxrecomp-v4/recompiler -B psxrecomp-v4/recompiler/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build psxrecomp-v4/recompiler/build --parallel 2 --target psxrecomp-game psxrecomp-bios
          (
            cd psxrecomp-v4
            bash tools/regen_bios.sh --config bios/OpenBIOS.toml
          )
          test -s generated/SCUS_944.23_dispatch.c

      - name: Assemble debug APK
        run: gradle --no-daemon --max-workers=2 -p android :app:assembleDebug

      - name: Verify APK was produced
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          file "$APK"
          echo "Experimental Android APK built. Commercial game data is not included."

      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ApeEscapeRecomp-Android-ARM64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
