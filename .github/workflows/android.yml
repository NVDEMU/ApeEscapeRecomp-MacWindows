name: Experimental Android APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'CMakeLists.txt'
      - 'game.toml'
      - 'mods/preloaded/**'
      - 'tools/apply_android_runtime_patch.py'
      - 'tools/test_android_support.py'
      - 'psxrecomp-v4'
      - 'recomp-ui'
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'CMakeLists.txt'
      - 'game.toml'
      - 'mods/preloaded/**'
      - 'tools/apply_android_runtime_patch.py'
      - 'tools/test_android_support.py'
      - 'psxrecomp-v4'
      - 'recomp-ui'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-arm64:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Android source patches and app scaffolding
        run: python tools/test_android_support.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
          sudo apt-get update
          sudo apt-get install -y mame-tools
          command -v chdman

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build recompiler and OpenBIOS runtime sources
        run: |
          set -euo pipefail
          cmake -S psxrecomp-v4/recompiler -B psxrecomp-v4/recompiler/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build psxrecomp-v4/recompiler/build --parallel 2 --target psxrecomp-game psxrecomp-bios
          (
            cd psxrecomp-v4
            bash tools/regen_bios.sh --config bios/OpenBIOS.toml
          )

      - name: Download private build-time game image
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
          GAME_ASSETS_REPO: NVDEMU/apeescapeprivateassets
          GAME_ASSETS_TAG: thing
          GAME_ASSETS_FILENAME: Ape.Escape.USA.chd
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/Ape Escape (USA).chd"
          python3 tools/download_disc.py "$DEST"
          test -s "$DEST"
          echo "The validated CHD remains in runner temp storage and is never packaged into the APK."

      - name: Prepare disc inputs for game code generation
        run: |
          set -euo pipefail
          chdman verify -i "$RUNNER_TEMP/Ape Escape (USA).chd"
          chdman extractcd \
            -i "$RUNNER_TEMP/Ape Escape (USA).chd" \
            -o "$RUNNER_TEMP/Ape Escape (USA).cue" \
            -ob "$RUNNER_TEMP/Ape Escape (USA).bin"
          test -s "$RUNNER_TEMP/Ape Escape (USA).cue"
          test -s "$RUNNER_TEMP/Ape Escape (USA).bin"
          python3 psxrecomp-v4/tools/prepare_disc.py "$RUNNER_TEMP/Ape Escape (USA).cue" --config game.toml
          test -s apeescape/SCUS_944.23

      - name: Generate or verify game translation
        run: |
          set -euo pipefail
          if [ ! -s generated/SCUS_944.23_dispatch.c ]; then
            psxrecomp-v4/recompiler/build/psxrecomp-game --config game.toml
          else
            echo "Using checked-in/cached game translation."
          fi
          test -s generated/SCUS_944.23_dispatch.c

      - name: Assemble debug APK
        run: gradle --no-daemon --max-workers=2 -p android :app:assembleDebug

      - name: Verify APK was produced
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          file "$APK"
          echo "Experimental Android APK built. Commercial game data is not included."

      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ApeEscapeRecomp-Android-ARM64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
